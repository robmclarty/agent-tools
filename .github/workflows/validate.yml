name: validate

on:
  push:
    paths:
      - ".claude-plugin/marketplace.json"
      - "plugins/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "plugins/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq, curl and node are preinstalled on ubuntu-latest.
      - name: Check (marketplace structure + source reachability, script tests)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check.sh --check-sources
