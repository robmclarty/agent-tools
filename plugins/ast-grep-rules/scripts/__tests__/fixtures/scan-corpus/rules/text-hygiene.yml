# Two rules in one file — the inventory must read `---`-separated documents.
id: no-console-log
language: TypeScript
severity: warning
message: Route output through the logger, not console.log.
rule:
  pattern: console.log($$$ARGS)
---
id: no-todo-comment
language: TypeScript
severity: hint
message: File an issue instead of leaving a TODO comment.
rule:
  kind: comment
  regex: "TODO"
