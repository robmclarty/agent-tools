id: no-untyped-json-parse
language: TypeScript
severity: warning
message: "Validate parsed JSON at the boundary: `const config = config_schema.parse(JSON.parse(raw))` — not a bare `JSON.parse`."
note: |
  `JSON.parse(x)` returns `any`, and `any` does not stay put: it flows into
  whatever the call site does next and quietly switches off type checking along
  that whole path. External data is where your types are least trustworthy, so
  validate it where it enters:

      const config_schema = z.object({ name: z.string(), retries: z.number() })
      const config = config_schema.parse(JSON.parse(raw))

  The rule accepts any `<schema>.parse(...)` or `<schema>.safeParse(...)` wrapper,
  so Zod, Valibot and ArkType all satisfy it — it asks for validation, not for a
  particular library.

  This ships as a `warning` rather than an `error` because legitimate bare parses
  do exist; reading back something you serialized yourself in the same process is
  the common one. When the use is legitimate, say so on the line:

      const cached = JSON.parse(raw) // ast-grep-ignore: no-untyped-json-parse

  That trailing form is the one that works. `ast-grep-ignore-next-line` on its own
  line does not. Path-wide exceptions go in `ignores` below.

rule:
  pattern: JSON.parse($$$A)
  not:
    inside:
      any:
        - pattern: $SCHEMA.parse(JSON.parse($$$A))
        - pattern: $SCHEMA.safeParse(JSON.parse($$$A))
      stopBy: end

ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.d.ts"
  - "**/dist/**"
  - "**/node_modules/**"
