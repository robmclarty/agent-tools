id: no-cross-package-relative-import
language: TypeScript
severity: error
message: "Import across a package boundary by name: `import { fn } from '@scope/other-package'` — not `../../../other-package/src/fn`."
note: |
  An import path carrying three or more `../` segments has almost certainly left
  the package it started in. That breaks the one thing that keeps a workspace
  navigable: each package has a single public entry, and everything outside it
  goes through that entry rather than reaching into `src/`.

      import { fn } from '@scope/other-package'

  Three segments is a heuristic, not a proof. Deep relative paths inside one
  package are legal, and this rule deliberately leaves one- and two-segment
  imports alone.

  If your modules have fixed names, replace the heuristic with those names and
  the rule stops guessing — it then catches a two-segment escape and stops
  flagging a three-segment path that never left the package:

      constraints:
        PATH:
          regex: '^(\.\./)+(core|engine|adapters|viewer)(/|$)'

  That is the version to grow into. The shipped one is what works before you have
  told it anything about your layout.

  When a long path really is intra-package, say so on the line:

      import { fn } from '../../../deep/file.ts' // ast-grep-ignore: no-cross-package-relative-import

  That trailing form is the one that works. `ast-grep-ignore-next-line` on its own
  line does not. Path-wide exceptions go in `ignores` below.

rule:
  any:
    - pattern: import $$$A from '$PATH'
    - pattern: import $$$A from "$PATH"

constraints:
  PATH:
    regex: "^\\.\\./\\.\\./\\.\\./"

ignores:
  - "**/*.d.ts"
  - "**/dist/**"
  - "**/node_modules/**"
