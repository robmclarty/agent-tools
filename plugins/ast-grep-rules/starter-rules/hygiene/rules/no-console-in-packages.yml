id: no-console-in-packages
language: TypeScript
severity: error
message: "Libraries must not log. Accept a logger or return diagnostics as data: `(opts: { log: (m: string) => void }) => opts.log('...')`."
note: |
  A library that writes to stdout cannot be embedded in a test harness, a
  language server, or another tool without adding noise to output it does not
  own. The program at the top of the stack decides what gets printed; the
  libraries underneath hand information back and let it decide.

  Three ways out, in order of preference:

      export const run = (opts: { log: (m: string) => void }) => opts.log('...')
      export const run = () => ({ ok: true, messages: ['...'] })
      export const run = () => { throw new ParseError('...') }

  `files:` below is the one glob in this tier that depends on your layout: it
  names the directory holding your libraries. If yours are not under `packages/`,
  change it — a glob that matches nothing makes this rule govern nothing,
  silently. Applications are meant to log, and keeping them outside `files:` is
  what draws that line.

  A legitimate exception goes on the line:

      console.log(banner) // ast-grep-ignore: no-console-in-packages

  That trailing form is the one that works. `ast-grep-ignore-next-line` on its own
  line does not. Path-wide exceptions go in `ignores` below.

rule:
  any:
    - pattern: console.log($$$A)
    - pattern: console.error($$$A)
    - pattern: console.warn($$$A)
    - pattern: console.info($$$A)
    - pattern: console.debug($$$A)

files:
  - "packages/**/*.ts"

ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.d.ts"
  - "**/dist/**"
  - "**/node_modules/**"
