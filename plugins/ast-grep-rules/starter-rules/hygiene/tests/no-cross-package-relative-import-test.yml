id: no-cross-package-relative-import
# The threshold is the whole rule, so `valid:` pins both sides of it: one and two
# `../` segments stay legal, three or more do not. A scoped import and a bare
# module specifier are here because the pattern must not match a non-relative path
# at all.
valid:
  - |
    import { fn } from '@scope/other-package'
  - |
    import { readFileSync } from 'node:fs'
  - |
    import { sibling } from '../sibling.ts'
  - |
    import { deep } from '../../inside-pkg/file.ts'

invalid:
  - |
    import { fn } from '../../../other-package/src/fn.ts'
  - |
    import type { t } from '../../../../other/src/types.ts'
