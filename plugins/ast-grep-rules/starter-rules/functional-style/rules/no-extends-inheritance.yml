id: no-extends-inheritance
language: TypeScript
severity: error
message: "Don't inherit. Compose by embedding the base record: `type cat = { animal: animal; meow: () => void }`."
note: |
  no-class-declaration is the primary rule; this one catches a class heritage
  clause specifically, so an `extends` or `implements` that slips past the first
  check — in a file with a path-level exception, say — is still visible.

      type animal = { kind: string }
      type cat = { animal: animal; meow: () => void }

  Inheritance couples a subclass to a base class's internals and to every future
  change in them. Embedding the base record as a field keeps the relationship
  explicit and one-directional.

  Interface extension is fine and is **not** matched: `interface extended extends
  base` describes a shape, not a runtime hierarchy.

  When you are extending a base class you do not control, say so on the line:

      class AppError extends Error {} // ast-grep-ignore: no-extends-inheritance

  That trailing form is the one that works. `ast-grep-ignore-next-line` on its own
  line does not. Note that the line above also trips no-class-declaration; a line
  needing both takes both ids, comma-separated. Path-wide exceptions go in
  `ignores` below.

rule:
  kind: class_heritage

ignores:
  - "**/*.d.ts"
  - "**/dist/**"
  - "**/node_modules/**"
