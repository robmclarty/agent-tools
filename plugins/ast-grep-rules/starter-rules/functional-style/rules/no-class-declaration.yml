id: no-class-declaration
language: TypeScript
severity: error
message: "Don't declare a `class`. Use a record plus free functions: `type counter = { count: number }; const increment = (c: counter): counter => ({ count: c.count + 1 })`."
note: |
  This is a house style, not a defect report — adopt this tier only where the
  project has actually chosen to be functional and procedural. Where it has, the
  replacement for a class is a module: one file, exported types, and exported
  functions that take the record as their first argument.

      type counter = { count: number }
      const increment = (c: counter): counter => ({ count: c.count + 1 })

  If a class feels necessary, it is usually one of three things in disguise:
    - a record type — `type user = { id: string; name: string }`
    - a factory function returning a closure over private state
    - a module of free functions taking the record as their first argument

  The real exception is a base class you do not control: an `Error` subclass, a
  migration, a framework's mandated shape. Say so on the line:

      class LegacyAdapter {} // ast-grep-ignore: no-class-declaration

  That trailing form is the one that works. `ast-grep-ignore-next-line` on its own
  line does not.

  Typed errors are the exception that recurs, because `class AppError extends
  Error` is the only way TypeScript gives you one. A repo that has several is
  better off collecting them in one module and naming that module in `ignores`
  below than scattering a suppression comment across the codebase — one listed
  path says "errors are the exception here", where twenty comments say nothing.

rule:
  any:
    - kind: class_declaration
    - kind: abstract_class_declaration

ignores:
  - "**/*.d.ts"
  - "**/dist/**"
  - "**/node_modules/**"
