id: no-this-keyword
# The `not: inside:` clause is the interesting half of this rule, so `valid:`
# pins a `this` in type position — a `this: void` parameter annotation and a
# polymorphic `this` return. Without those two cases the exemption in the note is
# a claim nothing checks.
valid:
  - |
    type counter = { count: number }
    const increment = (c: counter): counter => ({ count: c.count + 1 })
  - |
    const format = (self: { id: string }) => self.id
  - |
    function handler(this: void, event: string): void {
      log(event)
    }
  - |
    interface builder { add(): this }

invalid:
  - |
    const incr = function () {
      return this.count + 1
    }
  - |
    const get = () => this.value
  - |
    const with_default = (x = this.y) => x
